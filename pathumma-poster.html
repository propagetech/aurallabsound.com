<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATHUMMA Movie Poster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }
        .poster-container {
            position: relative;
            width: 600px;
            height: 900px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .poster-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 25%, #8b6f47 50%, #d4a574 75%, #e8c4a0 100%);
        }
        .sea {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(180deg, #1e3a3a 0%, #0f4f4f 50%, #062d2d 100%);
            opacity: 0.9;
        }
        .sea::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 40%, rgba(255, 200, 100, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 150, 100, 0.1) 0%, transparent 50%);
            animation: wave 8s ease-in-out infinite;
        }
        .waves {
            position: absolute;
            bottom: 8%;
            width: 100%;
            height: 20%;
            opacity: 0.6;
        }
        .wave {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,64 Q150,20 300,64 T600,64 T900,64 T1200,64 L1200,120 L0,120 Z" fill="rgba(255,200,100,0.08)"/></svg>') repeat-x;
            background-size: 600px 120px;
        }
        .wave:nth-child(1) {
            bottom: 10px;
            animation: drift 20s linear infinite;
        }
        .wave:nth-child(2) {
            bottom: 0;
            animation: drift 25s linear infinite reverse;
        }
        @keyframes drift {
            0% { transform: translateX(0); }
            100% { transform: translateX(600px); }
        }
        @keyframes wave {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }
        .hut {
            position: absolute;
            bottom: 28%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.3;
            filter: blur(1px);
        }
        .hut-base {
            width: 120px;
            height: 80px;
            background: #5a4a3a;
            border-radius: 0 0 40px 40px;
            position: relative;
            margin: 0 auto;
        }
        .hut-roof {
            width: 160px;
            height: 60px;
            background: linear-gradient(135deg, #8b5a2b 0%, #a0622d 50%, #6b4423 100%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            position: relative;
            left: -20px;
            top: -20px;
        }
        .hut-window {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #2d2d2d;
            border-radius: 2px;
            top: 30px;
            left: 50px;
        }
        .hands {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            opacity: 0.85;
            z-index: 10;
        }
        .hand {
            position: absolute;
            width: 80px;
            height: 120px;
            background: linear-gradient(135deg, #c9a961 0%, #d4b896 50%, #b8956a 100%);
            border-radius: 20px 20px 10px 10px;
        }
        .hand-left {
            left: 10px;
            top: 40px;
            transform: rotate(-25deg);
            box-shadow: -5px 5px 15px rgba(0, 0, 0, 0.4);
        }
        .hand-right {
            right: 10px;
            top: 50px;
            transform: rotate(35deg);
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.4);
        }
        .roti {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #f5deb3, #d4a574);
            border-radius: 50%;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) rotate(25deg);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
        }
        .title {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            width: 100%;
            padding: 0 30px;
        }
        .title h1 {
            font-size: 72px;
            font-weight: 400;
            color: #f5f5f5;
            letter-spacing: 3px;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
            font-style: italic;
        }
        .title-line {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4a574, transparent);
            margin: 0 auto 25px;
        }
        .subtitle {
            font-size: 16px;
            color: #d4a574;
            letter-spacing: 2px;
            font-weight: 300;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
        }
        .credit {
            position: absolute;
            bottom: 6%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 12px;
            color: #9d8b7e;
            letter-spacing: 1px;
        }
        .year {
            position: absolute;
            bottom: 3%;
            left: 20px;
            font-size: 14px;
            color: #8b7d70;
            font-weight: 300;
        }
        .laurel {
            position: absolute;
            top: 20px;
            font-size: 32px;
            opacity: 0.4;
        }
        .laurel-left {
            left: 20px;
        }
        .laurel-right {
            right: 20px;
        }
    </style>
</head>
<body>
    <div class="poster-container">
        <div class="poster-bg"></div>

        <div class="laurel laurel-left">✦</div>
        <div class="laurel laurel-right">✦</div>

        <div class="hut">
            <div class="hut-roof"></div>
            <div class="hut-base">
                <div class="hut-window"></div>
            </div>
        </div>

        <div class="hands">
            <div class="hand hand-left"></div>
            <div class="hand hand-right"></div>
            <div class="roti"></div>
        </div>

        <div class="sea">
            <div class="waves">
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>

        <div class="title">
            <h1>PATHUMMA</h1>
            <div class="title-line"></div>
            <p class="subtitle">
                A story of resilience, dignity, and the unbreakable bonds of community harmony
            </p>
        </div>

        <div class="credit">
            <div>Director: Panchakshari</div>
        </div>

        <div class="year">2017</div>
    </div>
</body>
</html>
