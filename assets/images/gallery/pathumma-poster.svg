<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a472a;stop-opacity:1" />
            <stop offset="25%" style="stop-color:#2d5a3d;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#8b6f47;stop-opacity:1" />
            <stop offset="75%" style="stop-color:#d4a574;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#e8c4a0;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1e3a3a;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0f4f4f;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#062d2d;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#c9a961;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#d4b896;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b8956a;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="rotiGradient" x1="30%" y1="30%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f5deb3;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
        </linearGradient>
        <radialGradient id="goldLine" cx="50%" cy="50%">
            <stop offset="0%" style="stop-color:#d4a574;stop-opacity:0" />
            <stop offset="50%" style="stop-color:#d4a574;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4a574;stop-opacity:0" />
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="900" fill="url(#bgGradient)"/>

    <!-- Hut shadow background -->
    <ellipse cx="300" cy="350" rx="100" ry="80" fill="rgba(0,0,0,0.15)"/>

    <!-- Hut structure (semi-transparent) -->
    <g opacity="0.3">
        <!-- Hut base -->
        <path d="M 250 280 L 350 280 L 370 350 Q 300 380 230 350 Z" fill="#5a4a3a" stroke="none"/>

        <!-- Hut roof -->
        <path d="M 220 280 L 300 180 L 380 280" fill="#8b5a2b" stroke="none"/>
        <path d="M 230 280 L 300 190 L 370 280" fill="#a0622d" stroke="none"/>

        <!-- Window -->
        <rect x="285" y="300" width="30" height="30" fill="#2d2d2d" rx="2"/>
    </g>

    <!-- Hands and work -->
    <g>
        <!-- Left hand -->
        <ellipse cx="200" cy="320" rx="50" ry="80" fill="url(#handGradient)" transform="rotate(-25 200 320)"/>

        <!-- Right hand -->
        <ellipse cx="400" cy="340" rx="50" ry="80" fill="url(#handGradient)" transform="rotate(35 400 340)"/>

        <!-- Roti in center -->
        <circle cx="300" cy="280" r="45" fill="url(#rotiGradient)" filter="drop-shadow(3px 3px 8px rgba(0,0,0,0.3))"/>
        <circle cx="300" cy="280" r="40" fill="none" stroke="rgba(139, 111, 71, 0.3)" stroke-width="2"/>

        <!-- Texture on roti -->
        <circle cx="315" cy="265" r="3" fill="rgba(139, 111, 71, 0.4)"/>
        <circle cx="290" cy="295" r="2" fill="rgba(139, 111, 71, 0.4)"/>
        <circle cx="320" cy="290" r="2.5" fill="rgba(139, 111, 71, 0.4)"/>
    </g>

    <!-- Sea waves -->
    <g opacity="0.8">
        <rect x="0" y="620" width="600" height="280" fill="url(#seaGradient)"/>

        <!-- Wave patterns -->
        <path d="M 0,640 Q 150,600 300,640 T 600,640" stroke="rgba(255,200,100,0.12)" stroke-width="2" fill="none"/>
        <path d="M 0,680 Q 150,650 300,680 T 600,680" stroke="rgba(255,200,100,0.08)" stroke-width="2" fill="none"/>
        <path d="M 0,720 Q 150,690 300,720 T 600,720" stroke="rgba(255,150,100,0.1)" stroke-width="1.5" fill="none"/>

        <!-- Shimmer effect -->
        <circle cx="100" cy="750" r="40" fill="rgba(255,200,100,0.08)"/>
        <circle cx="500" cy="800" r="50" fill="rgba(255,150,100,0.06)"/>
    </g>

    <!-- Decorative laurels -->
    <g opacity="0.4" font-size="36" fill="#d4a574">
        <text x="20" y="50">✦</text>
        <text x="540" y="50" text-anchor="end">✦</text>
    </g>

    <!-- Title area background (subtle) -->
    <rect x="50" y="480" width="500" height="200" fill="rgba(0,0,0,0.1)" rx="10"/>

    <!-- Title -->
    <text x="300" y="560" font-size="72" font-family="Georgia, serif" font-weight="400" fill="#f5f5f5" text-anchor="middle" letter-spacing="3" filter="drop-shadow(3px 3px 8px rgba(0,0,0,0.6))" font-style="italic">PATHUMMA</text>

    <!-- Decorative line -->
    <line x1="200" y1="590" x2="400" y2="590" stroke="url(#goldLine)" stroke-width="2" opacity="0.7"/>

    <!-- Subtitle -->
    <text x="300" y="625" font-size="14" font-family="Georgia, serif" fill="#d4a574" text-anchor="middle" letter-spacing="1">A story of resilience, dignity,</text>
    <text x="300" y="645" font-size="14" font-family="Georgia, serif" fill="#d4a574" text-anchor="middle" letter-spacing="1">and unbreakable community bonds</text>

    <!-- Director credit -->
    <text x="300" y="830" font-size="12" font-family="Georgia, serif" fill="#9d8b7e" text-anchor="middle" letter-spacing="1">Director: Panchakshari</text>

    <!-- Year -->
    <text x="30" y="870" font-size="14" font-family="Georgia, serif" fill="#8b7d70" letter-spacing="1">2017</text>
</svg>