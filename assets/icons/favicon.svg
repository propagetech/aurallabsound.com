<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle that adapts to theme -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .favicon-bg { fill: #0F0F0F; }
        .favicon-fg { fill: #7BA3FF; }
      }
      @media (prefers-color-scheme: light) {
        .favicon-bg { fill: #FFFFFF; }
        .favicon-fg { fill: #1D4ED8; }
      }
    </style>
  </defs>

  <rect class="favicon-bg" width="64" height="64" rx="12"/>

  <!-- Sound wave icon -->
  <g class="favicon-fg">
    <!-- Speaker dot -->
    <circle cx="20" cy="32" r="3"/>

    <!-- Sound waves -->
    <path d="M 28 32 Q 28 26 32 26 Q 36 26 36 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 38 32 Q 38 22 44 22 Q 50 22 50 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
