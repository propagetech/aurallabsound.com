<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Logo for Dark Theme -->

  <!-- Sound wave symbol -->
  <g transform="translate(8, 10)">
    <!-- Speaker/source circle -->
    <circle cx="8" cy="20" r="4" fill="#7BA3FF"/>

    <!-- Sound waves -->
    <path d="M 16 20 Q 16 12 22 12 Q 28 12 28 20" fill="none" stroke="#7BA3FF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 32 20 Q 32 8 40 8 Q 48 8 48 20" fill="none" stroke="#7BA3FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text: Aural Lab Sound -->
  <text x="70" y="28" font-family="Playfair Display, Georgia, serif" font-size="18" font-weight="600" fill="#F5F5F5" letter-spacing="-0.5">
    Aural Lab
  </text>
  <text x="70" y="43" font-family="Quicksand, sans-serif" font-size="11" font-weight="400" fill="#CCCCCC" letter-spacing="0.5">
    SOUND
  </text>

  <!-- Optional accent line -->
  <line x1="70" y1="50" x2="200" y2="50" stroke="#7BA3FF" stroke-width="1" opacity="0.4"/>
</svg>
