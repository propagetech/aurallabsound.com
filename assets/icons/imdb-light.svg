<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <!-- IMDB Logo - Light Theme -->
  <defs>
    <style>
      .imdb-bg { fill: #F3CE13; }
      .imdb-text { fill: #000; }
    </style>
  </defs>

  <!-- Yellow background -->
  <rect class="imdb-bg" width="100" height="60" rx="4"/>

  <!-- IMDb text -->
  <text x="50" y="42" font-family="Arial, sans-serif" font-size="32" font-weight="900" text-anchor="middle" class="imdb-text">IMDb</text>
</svg>
