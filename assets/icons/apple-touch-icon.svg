<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Light background for Apple devices (usually on light home screen) -->
  <rect width="180" height="180" fill="#FFFFFF"/>

  <!-- Subtle border -->
  <rect width="180" height="180" fill="none" stroke="#1D4ED8" stroke-width="1" opacity="0.2"/>

  <!-- Sound wave icon centered -->
  <g transform="translate(45, 60)">
    <!-- Speaker dot -->
    <circle cx="20" cy="32" r="5" fill="#1D4ED8"/>

    <!-- Sound waves -->
    <path d="M 35 32 Q 35 22 42 22 Q 49 22 49 32" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 53 32 Q 53 18 65 18 Q 77 18 77 32" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
